<title>소니드 공부방 · 문제풀이 & 오답노트</title>
<style>
  :root{
    --bg:#eef4fb; --surface:#ffffff; --surface-2:#eaf1f9; --border:#dbe6f2;
    --text:#1e2b3a; --text-2:#5b6b7e; --text-3:#8a97a8;
    --brand:#2f7fd6; --brand-2:#1e63ad; --brand-soft:#e2eefb;
    --accent:#ff9a52; --accent-soft:#fff0e3;
    --good:#22a35a; --good-soft:#dff3e7;
    --bad:#e5533c; --bad-soft:#fce3de;
    --shadow:0 2px 4px rgba(30,50,80,.05),0 10px 26px rgba(30,50,80,.08);
    --radius:18px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#111823; --surface:#1a2431; --surface-2:#22303f; --border:#2e3d4f;
      --text:#eef4fb; --text-2:#a7b6c7; --text-3:#76889a;
      --brand:#5aa2e6; --brand-2:#7cb6ee; --brand-soft:#1c2c3e;
      --accent:#ffab6b; --accent-soft:#33241a;
      --good:#4cc27f; --good-soft:#16311f;
      --bad:#f27661; --bad-soft:#3a1e18;
      --shadow:0 2px 4px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"]{
    --bg:#eef4fb; --surface:#ffffff; --surface-2:#eaf1f9; --border:#dbe6f2;
    --text:#1e2b3a; --text-2:#5b6b7e; --text-3:#8a97a8;
    --brand:#2f7fd6; --brand-2:#1e63ad; --brand-soft:#e2eefb;
    --accent:#ff9a52; --accent-soft:#fff0e3;
    --good:#22a35a; --good-soft:#dff3e7; --bad:#e5533c; --bad-soft:#fce3de;
    --shadow:0 2px 4px rgba(30,50,80,.05),0 10px 26px rgba(30,50,80,.08);
  }
  :root[data-theme="dark"]{
    --bg:#111823; --surface:#1a2431; --surface-2:#22303f; --border:#2e3d4f;
    --text:#eef4fb; --text-2:#a7b6c7; --text-3:#76889a;
    --brand:#5aa2e6; --brand-2:#7cb6ee; --brand-soft:#1c2c3e;
    --accent:#ffab6b; --accent-soft:#33241a;
    --good:#4cc27f; --good-soft:#16311f; --bad:#f27661; --bad-soft:#3a1e18;
    --shadow:0 2px 4px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px; margin:0 auto; padding:20px 16px 60px; min-height:100vh}
  button{font-family:inherit; cursor:pointer}
  .hidden{display:none !important}

  .appbar{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,var(--brand),var(--brand-2));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:var(--shadow)}
  .appbar h1{font-size:1.25rem;margin:0;font-weight:800;letter-spacing:-.02em}
  .appbar .who{margin-left:auto;font-size:.82rem;color:var(--text-2);background:var(--surface);border:1px solid var(--border);padding:6px 12px;border-radius:20px;font-weight:600}

  .weekbanner{background:var(--brand-soft);border:1px solid var(--brand);color:var(--brand);border-radius:12px;padding:11px 14px;font-weight:700;font-size:.86rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .dailystat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:.9rem;color:var(--text-2);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
  .dailystat .em{font-size:1.3rem}
  .dailystat b{color:var(--brand);font-variant-numeric:tabular-nums;font-size:1.05rem}

  .section-t{font-size:.78rem;font-weight:800;letter-spacing:.03em;color:var(--text-3);text-transform:uppercase;margin:20px 4px 10px}

  .pickrow{display:flex;gap:10px;flex-wrap:wrap}
  .pick{flex:1;min-width:120px;background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:14px;font-size:1rem;font-weight:700;color:var(--text);transition:.15s;text-align:center}
  .pick .emo{font-size:1.5rem;display:block;margin-bottom:2px}
  .pick .gr{display:block;font-size:.74rem;color:var(--text-3);font-weight:600;margin-top:2px}
  .pick.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
  .pick.on .gr{color:var(--brand)}
  .pick:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

  .subjects{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .subj{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 8px;text-align:center;box-shadow:var(--shadow);transition:.15s}
  .subj:hover{transform:translateY(-3px);border-color:var(--brand)}
  .subj .semo{font-size:2rem;display:block;margin-bottom:6px}
  .subj .sname{font-weight:800;font-size:1rem}
  .subj .scount{font-size:.7rem;color:var(--brand);margin-top:4px;display:block;font-weight:600;line-height:1.3}

  .bigbtn{display:block;width:100%;border:none;border-radius:14px;background:var(--brand);color:#fff;font-size:1.05rem;font-weight:800;padding:16px;box-shadow:var(--shadow);transition:.15s;margin-top:16px}
  .bigbtn:hover{background:var(--brand-2)}
  .bigbtn.ghost{background:var(--surface);color:var(--brand);border:2px solid var(--border)}

  .noteopen{display:flex;align-items:center;gap:10px;width:100%;background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);border-radius:14px;padding:13px 16px;font-weight:800;font-size:.95rem;margin-top:12px}
  .noteopen .cnt{margin-left:auto;background:var(--accent);color:#fff;border-radius:20px;padding:1px 10px;font-size:.8rem}

  .qtop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .qtop .back{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:38px;height:38px;font-size:1.1rem;color:var(--text-2)}
  .progress{flex:1;height:10px;background:var(--surface-2);border-radius:20px;overflow:hidden}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));width:0;transition:width .3s;border-radius:20px}
  .qcount{font-size:.82rem;font-weight:700;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}

  .qcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 20px;box-shadow:var(--shadow)}
  .qtag{display:inline-block;font-size:.72rem;font-weight:800;color:var(--brand);background:var(--brand-soft);padding:3px 11px;border-radius:20px;margin-bottom:12px}
  .qtag.retry{color:var(--accent);background:var(--accent-soft)}
  .qtext{font-size:1.25rem;font-weight:700;line-height:1.45;margin-bottom:18px;text-wrap:balance;white-space:pre-wrap}
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:14px 16px;font-size:1.05rem;font-weight:600;color:var(--text);text-align:left;transition:.12s}
  .choice:hover:not(:disabled){border-color:var(--brand)}
  .choice .key{width:28px;height:28px;flex:0 0 auto;border-radius:8px;background:var(--surface-2);color:var(--text-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem}
  .choice.correct{border-color:var(--good);background:var(--good-soft)}
  .choice.correct .key{background:var(--good);color:#fff}
  .choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .choice.wrong .key{background:var(--bad);color:#fff}
  .choice:disabled{cursor:default}

  .feedback{margin-top:16px;border-radius:14px;padding:14px 16px;font-size:.92rem;line-height:1.5}
  .feedback.ok{background:var(--good-soft);border:1px solid var(--good)}
  .feedback.no{background:var(--bad-soft);border:1px solid var(--bad)}
  .feedback .fh{font-weight:800;margin-bottom:4px}
  .feedback.ok .fh{color:var(--good)} .feedback.no .fh{color:var(--bad)}
  .feedback .exp{color:var(--text-2)}
  .feedback .exp b{color:var(--text)}

  .result{text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:30px 22px;box-shadow:var(--shadow)}
  .result .big{font-size:3.2rem;margin-bottom:6px}
  .result .score{font-size:2.4rem;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
  .result .score small{font-size:1.1rem;color:var(--text-3);font-weight:600}
  .result .msg{font-size:1.05rem;font-weight:700;margin:8px 0 2px}
  .result .sub{color:var(--text-2);font-size:.9rem}
  .result .today{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:.9rem;color:var(--text-2)}
  .result .today b{color:var(--brand)}

  .wbitem{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--bad);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px}
  .wbitem .wtag{font-size:.7rem;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
  .wbitem .wq{font-weight:700;margin:4px 0 6px;white-space:pre-wrap}
  .wbitem .wa{font-size:.86rem;color:var(--good);font-weight:700}
  .wbitem .we{font-size:.82rem;color:var(--text-2);margin-top:4px}
  .empty{text-align:center;color:var(--text-3);padding:40px 20px;font-size:.95rem}
  .empty .big{font-size:2.5rem;display:block;margin-bottom:8px}

  .row2{display:flex;gap:10px;margin-top:14px}
  .row2 .bigbtn{margin-top:0}
</style>

<div class="wrap">
  <div class="appbar">
    <div class="logo">🎒</div>
    <h1>소니드 공부방</h1>
    <button class="who" id="whoChip">태희</button>
  </div>

  <!-- HOME -->
  <div id="home">
    <div class="weekbanner" id="weekBanner">📅 진도 계산 중…</div>
    <div class="dailystat" id="dailyStat"><span class="em">🔥</span><span>오늘 <b id="dToday">0</b>문제 풀었어요 · 정답 <b id="dCorrect">0</b></span></div>

    <div class="section-t">누가 공부할까요?</div>
    <div class="pickrow" id="childPick">
      <button class="pick on" data-child="태희"><span class="emo">👧</span>태희<span class="gr">5학년 2학기</span></button>
      <button class="pick" data-child="태정"><span class="emo">🧒</span>태정<span class="gr">4학년 2학기</span></button>
    </div>

    <div class="section-t">과목을 골라요 <span style="text-transform:none;font-weight:600;color:var(--text-3)">· 오늘 진도까지</span></div>
    <div class="subjects" id="subjectPick">
      <button class="subj" data-subj="math"><span class="semo">🔢</span><span class="sname">수학</span><span class="scount" data-c="math">–</span></button>
      <button class="subj" data-subj="korean"><span class="semo">📖</span><span class="sname">국어</span><span class="scount" data-c="korean">–</span></button>
      <button class="subj" data-subj="english"><span class="semo">🔤</span><span class="sname">영어</span><span class="scount" data-c="english">–</span></button>
    </div>

    <button class="noteopen" id="openNote">📒 오답노트 <span class="cnt" id="noteCnt">0</span></button>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden">
    <div class="qtop">
      <button class="back" id="quizBack" aria-label="홈으로">←</button>
      <div class="progress"><i id="progBar"></i></div>
      <span class="qcount" id="qCount">1/8</span>
    </div>
    <div class="qcard">
      <span class="qtag" id="qTag">수학</span>
      <div class="qtext" id="qText">문제</div>
      <div class="choices" id="choices"></div>
      <div class="feedback hidden" id="feedback"></div>
    </div>
    <button class="bigbtn hidden" id="nextBtn">다음 →</button>
  </div>

  <!-- RESULT -->
  <div id="result" class="hidden">
    <div class="result">
      <div class="big" id="rEmoji">🎉</div>
      <div class="score" id="rScore">0<small>/8</small></div>
      <div class="msg" id="rMsg">잘했어요!</div>
      <div class="sub" id="rSub"></div>
      <div class="today" id="rToday"></div>
    </div>
    <div class="row2">
      <button class="bigbtn ghost" id="rHome">🏠 홈으로</button>
      <button class="bigbtn" id="rRetry">↺ 다시 풀기</button>
    </div>
    <button class="noteopen" id="rNote">📒 오답노트 보기 <span class="cnt" id="rNoteCnt">0</span></button>
  </div>

  <!-- WRONGBOOK -->
  <div id="wrongbook" class="hidden">
    <div class="qtop">
      <button class="back" id="wbBack" aria-label="홈으로">←</button>
      <div class="qcount" style="flex:1">📒 <span id="wbWho">태희</span>의 오답노트</div>
    </div>
    <div id="wbList"></div>
    <div class="row2" id="wbActions">
      <button class="bigbtn ghost" id="wbClear">전체 지우기</button>
      <button class="bigbtn" id="wbRetry">↺ 오답만 다시 풀기</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const CHILD_GRADE = { "태희":5, "태정":4 };

  // 2학기 단원 순서(진도 추정용)
  const UNITS = {
    math:   { 4:["분수의 덧셈과 뺄셈","삼각형","소수","사각형","꺾은선그래프","다각형"],
              5:["수의 범위와 어림","분수의 곱셈","합동과 대칭","소수의 곱셈","직육면체","평균과 가능성"] },
    korean: { 4:["낱말의 뜻","맞춤법","높임 표현","이어 주는 말","비슷한말·반대말","흉내내는 말"],
              5:["맞춤법","반대말","속담","높임 표현","반대말","관용 표현"] },
    english:{ 4:["동물 낱말","색깔","인사","숫자","감사 표현","사물 낱말"],
              5:["낱말","be동사","복수형","be동사","의문문","요일"] }
  };

  // 문제 은행 (u=단원순서, gen=비슷한문제 생성기)
  const BANK = {
    math: {
      4: [
        {u:1, gen:"fracAddSame", q:"3/5 + 1/5 = ?", c:["4/5","4/10","3/25","2/5"], a:0, e:"분모가 같으면 분자끼리 더해요: 3+1=4 → 4/5"},
        {u:1, gen:"fracSubSame", q:"5/6 - 2/6 = ?", c:["1/2","3/12","7/6","2/6"], a:0, e:"5/6-2/6=3/6, 약분하면 1/2"},
        {u:2, q:"세 각의 크기가 모두 60°인 삼각형의 이름은?", c:["정삼각형","직각삼각형","둔각삼각형","이등변삼각형"], a:0, e:"세 변·세 각이 모두 같은 삼각형은 정삼각형"},
        {u:3, gen:"decAdd", q:"0.3 + 0.4 = ?", c:["0.7","0.07","7","0.12"], a:0, e:"소수점을 맞춰 더하면 0.3+0.4=0.7"},
        {u:3, q:"0.6 은 0.1 이 몇 개인 수일까요?", c:["6개","60개","10개","16개"], a:0, e:"0.6 = 0.1이 6개"},
        {u:4, q:"직사각형의 한 각의 크기는?", c:["90°","60°","100°","120°"], a:0, e:"직사각형의 네 각은 모두 직각(90°)"},
        {u:6, q:"오각형의 변은 모두 몇 개일까요?", c:["5개","6개","4개","8개"], a:0, e:"오각형은 변이 5개예요"}
      ],
      5: [
        {u:1, gen:"roundInt", q:"3.7을 반올림하여 자연수로 나타내면?", c:["4","3","3.5","40"], a:0, e:"소수 첫째 자리 7은 5 이상이라 올림 → 4"},
        {u:2, gen:"fracTimesInt", q:"2/3 × 6 = ?", c:["4","12/3","2/18","9"], a:0, e:"2/3 × 6 = 12/3 = 4"},
        {u:2, gen:"fracMul", q:"1/2 × 1/4 = ?", c:["1/8","2/6","1/6","4/2"], a:0, e:"분자끼리, 분모끼리 곱해요: (1×1)/(2×4)=1/8"},
        {u:3, q:"모양과 크기가 같아 완전히 포개지는 두 도형을?", c:["합동","대칭","닮음","평행"], a:0, e:"완전히 겹치면 '합동'이에요"},
        {u:4, gen:"decMul", q:"0.6 × 0.5 = ?", c:["0.3","0.11","3","0.35"], a:0, e:"6×5=30, 소수 두 자리 → 0.30 = 0.3"},
        {u:5, q:"직육면체의 면은 모두 몇 개일까요?", c:["6개","8개","12개","4개"], a:0, e:"직육면체는 면 6, 모서리 12, 꼭짓점 8"},
        {u:6, q:"국어 80점, 수학 90점, 영어 85점의 평균은?", c:["85점","80점","90점","88점"], a:0, e:"(80+90+85)÷3 = 255÷3 = 85"},
        {u:6, q:"주사위 한 개를 던질 때 3이 나올 가능성은?", c:["1/6","1/3","1/2","0"], a:0, e:"1~6 중 3은 하나 → 1/6"}
      ]
    },
    korean: {
      4: [
        {u:1, q:"'길다'의 반대말은?", c:["짧다","크다","넓다","높다"], a:0, e:"길이가 긴 것의 반대는 '짧다'"},
        {u:2, q:"맞춤법이 바른 것은?", c:["깨끗이","깨끄시","깨끗히","깨끄치"], a:0, e:"'깨끗이'가 바른 표기예요"},
        {u:3, q:"'있다'를 웃어른께 높여 쓰는 말은?", c:["계시다","있으시다","기시다","있다"], a:0, e:"'할머니가 계시다'처럼 '계시다'"},
        {u:4, q:"\"비가 왔다. ( ) 우산을 썼다.\" 빈칸에 알맞은 말은?", c:["그래서","그러나","하지만","그런데"], a:0, e:"앞이 원인, 뒤가 결과라 '그래서'"},
        {u:5, q:"'아름답다'와 비슷한 뜻의 말은?", c:["예쁘다","무섭다","슬프다","빠르다"], a:0, e:"아름답다 ≒ 예쁘다"},
        {u:6, q:"강아지가 짖는 소리를 흉내낸 말은?", c:["멍멍","야옹","짹짹","꿀꿀"], a:0, e:"개는 멍멍, 고양이 야옹, 새 짹짹, 돼지 꿀꿀"}
      ],
      5: [
        {u:1, q:"맞춤법이 바른 것은?", c:["며칠","몇일","몇 일","며 칠"], a:0, e:"'몇 월 며칠'처럼 '며칠'이 바른 표기"},
        {u:2, q:"'희망'의 반대말은?", c:["절망","소망","기대","꿈"], a:0, e:"희망(바람)의 반대는 절망"},
        {u:3, q:"속담 '티끌 모아 ( )' 빈칸은?", c:["태산","언덕","바다","산"], a:0, e:"작은 것도 모으면 큰 것이 된다 → 태산"},
        {u:4, q:"'밥'을 높여 부르는 말은?", c:["진지","맘마","끼니","간식"], a:0, e:"웃어른께는 '진지 드세요'"},
        {u:5, q:"'빠르다'의 반대말은?", c:["느리다","이르다","급하다","날쌔다"], a:0, e:"속도가 빠른 것의 반대는 느린 것"},
        {u:6, q:"관용어 '발이 넓다'의 뜻은?", c:["아는 사람이 많다","발이 크다","잘 걷는다","성격이 급하다"], a:0, e:"사귀는 사람이 많다는 뜻"}
      ]
    },
    english: {
      4: [
        {u:1, q:"'cat' 의 뜻은?", c:["고양이","강아지","토끼","쥐"], a:0, e:"cat = 고양이 🐱"},
        {u:2, q:"'blue' 는 무슨 색일까요?", c:["파랑","빨강","노랑","초록"], a:0, e:"blue = 파랑"},
        {u:3, q:"\"Good morning!\" 의 뜻은?", c:["좋은 아침!","잘 자!","고마워!","안녕히 가세요!"], a:0, e:"아침 인사 '좋은 아침!'"},
        {u:4, q:"숫자 'seven' 은?", c:["7","5","9","6"], a:0, e:"seven = 7"},
        {u:5, q:"\"Thank you.\" 의 뜻은?", c:["고맙습니다","미안합니다","안녕하세요","사랑해요"], a:0, e:"감사 인사 '고맙습니다'"},
        {u:6, q:"'book' 의 뜻은?", c:["책","연필","가방","의자"], a:0, e:"book = 책 📖"}
      ],
      5: [
        {u:1, q:"'apple' 의 뜻은?", c:["사과","바나나","포도","오렌지"], a:0, e:"apple = 사과 🍎"},
        {u:2, q:"I ___ a student. 빈칸에 알맞은 것은?", c:["am","is","are","be"], a:0, e:"주어 I 에는 be동사 'am'"},
        {u:3, q:"'dog' 의 복수형(둘 이상)은?", c:["dogs","doges","dog's","dogies"], a:0, e:"보통 명사는 끝에 -s: dog → dogs"},
        {u:4, q:"She ___ happy. 빈칸에 알맞은 것은?", c:["is","am","are","be"], a:0, e:"주어 She 에는 be동사 'is'"},
        {u:5, q:"나이를 물을 때: How ___ are you?", c:["old","many","much","tall"], a:0, e:"How old are you? 로 물어요"},
        {u:6, q:"'Monday' 다음 요일은?", c:["Tuesday","Sunday","Friday","March"], a:0, e:"월요일(Monday) 다음은 화요일(Tuesday)"}
      ]
    }
  };
  const SUBJ_KO = {math:"수학", korean:"국어", english:"영어"};

  // ---------- 비슷한 문제 생성기 ----------
  function rnd(n){ return Math.floor(Math.random()*n); }
  function gcd(a,b){ return b?gcd(b,a%b):a; }
  function fstr(n,d){ if(d===0) return ""+n; const g=gcd(Math.abs(n),Math.abs(d))||1; n/=g; d/=g; return d===1?(""+n):(n+"/"+d); }
  function pick4(correct, distractors){
    const set=[correct];
    for(const x of distractors){ if(set.length>=4) break; if(x!=null && !set.includes(String(x))) set.push(String(x)); }
    let k=2; while(set.length<4){ const c=String(k); if(!set.includes(c)) set.push(c); k++; }
    for(let i=set.length-1;i>0;i--){ const j=rnd(i+1); [set[i],set[j]]=[set[j],set[i]]; }
    return { c:set, a:set.indexOf(String(correct)) };
  }
  const GEN = {
    fracAddSame(){ const ds=[4,5,6,8]; const d=ds[rnd(4)]; let a=1+rnd(d-2); let b=1+rnd(Math.max(1,d-1-a)); if(a+b>d){b=d-a;} if(b<1)b=1; const s=a+b;
      const cor=fstr(s,d);
      return Object.assign({q:a+"/"+d+" + "+b+"/"+d+" = ?", e:"분모가 같으면 분자끼리 더해요: "+a+"+"+b+"="+s+" → "+cor}, pick4(cor,[fstr(s,2*d),fstr(a*b,d),fstr(s+1,d)])); },
    fracSubSame(){ const ds=[4,5,6,8]; const d=ds[rnd(4)]; let a=2+rnd(d-1); if(a>d)a=d; let b=1+rnd(a-1); const diff=a-b;
      const cor=fstr(diff,d);
      return Object.assign({q:a+"/"+d+" - "+b+"/"+d+" = ?", e:"분모가 같으면 분자끼리 빼요: "+a+"-"+b+"="+diff+" → "+cor}, pick4(cor,[fstr(a+b,d),fstr(diff,2*d),fstr(diff+1,d)])); },
    decAdd(){ const xi=1+rnd(8), yi=1+rnd(8); const t=xi+yi; const dstr=v=>{const w=Math.floor(v/10),f=v%10; return f?(w+"."+f):(""+w);};
      const cor=dstr(t);
      return Object.assign({q:"0."+xi+" + 0."+yi+" = ?", e:"소수점을 맞춰 더하면 "+cor}, pick4(cor,[dstr(t+1), dstr(t>1?t-1:t+2), xi+"."+yi])); },
    decMul(){ const ai=1+rnd(8), bi=1+rnd(8); const h=ai*bi; const val=(h/100); const cor=(+val.toFixed(2)).toString();
      return Object.assign({q:"0."+ai+" × 0."+bi+" = ?", e:ai+"×"+bi+"="+h+", 소수 두 자리 → "+cor}, pick4(cor,[(+(h/10).toFixed(1)).toString(), ""+h, (+((h+1)/100).toFixed(2)).toString()])); },
    fracTimesInt(){ const bs=[2,3,4,5]; const b=bs[rnd(4)]; const a=1+rnd(b-1); const m=1+rnd(3); const k=b*m; const res=a*m;
      return Object.assign({q:a+"/"+b+" × "+k+" = ?", e:a+"/"+b+" × "+k+" = "+(a*k)+"/"+b+" = "+res}, pick4(""+res,[""+(a*k), fstr(a*k,b*2), ""+(res+1)])); },
    fracMul(){ const s=[2,3,4,5]; const b=s[rnd(4)], d=s[rnd(4)]; const a=1+rnd(b-1), c=1+rnd(d-1); const cor=fstr(a*c,b*d);
      return Object.assign({q:a+"/"+b+" × "+c+"/"+d+" = ?", e:"분자끼리, 분모끼리: ("+a+"×"+c+")/("+b+"×"+d+") = "+cor}, pick4(cor,[fstr(a+c,b+d),fstr(a*c,b+d),fstr(a*c+1,b*d)])); },
    roundInt(){ const n=11+rnd(88); const x=n/10; const cor=Math.round(x); const fd=n%10;
      return Object.assign({q:x.toFixed(1)+"을 반올림하여 자연수로 나타내면?", e:"소수 첫째 자리 "+fd+"은 "+(fd>=5?"5 이상이라 올림":"5 미만이라 버림")+" → "+cor}, pick4(""+cor,[""+Math.floor(x),""+Math.ceil(x),""+(cor+1)])); }
  };

  // ---------- 저장 ----------
  const LS = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
  let child = LS.get("study_child","태희"); if(!CHILD_GRADE[child]) child="태희";
  let grade = CHILD_GRADE[child], subject="math";
  let quizList=[], qi=0, score=0, answered=false, retryMode=false;

  const $ = id => document.getElementById(id);
  function show(s){ ["home","quiz","result","wrongbook"].forEach(x=>$(x).classList.toggle("hidden", x!==s)); window.scrollTo(0,0); }
  function wrongKey(c){ return "study_wrong_"+(c||child); }
  function getWrongs(c){ return LS.get(wrongKey(c),[]); }
  function saveWrongs(l,c){ LS.set(wrongKey(c),l); }

  // ---------- 진도(날짜) ----------
  const SEM_START = new Date(2026,7,18); // 2026-08-18 (2학기 시작 추정)
  const TOTAL_WEEKS = 18;
  function curWeek(){ const now=new Date(); const w=Math.floor((now-SEM_START)/(7*86400000))+1; return Math.min(Math.max(w,1),TOTAL_WEEKS); }
  function unlockedUnit(subj,g){ const units=UNITS[subj][g].length; const per=TOTAL_WEEKS/units; return Math.min(Math.max(Math.ceil(curWeek()/per),1),units); }
  function unitName(subj,g){ return UNITS[subj][g][unlockedUnit(subj,g)-1]; }

  // ---------- 오늘 푼 개수 ----------
  function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
  function getDaily(){ const d=LS.get("study_daily_"+child,{date:"",solved:0,correct:0}); if(d.date!==todayStr()) return {date:todayStr(),solved:0,correct:0}; return d; }
  function bumpDaily(correct){ const d=getDaily(); d.solved++; if(correct)d.correct++; LS.set("study_daily_"+child,d); }

  function refreshHome(){
    grade=CHILD_GRADE[child];
    $("whoChip").textContent=child;
    document.querySelectorAll("#childPick .pick").forEach(b=>b.classList.toggle("on", b.dataset.child===child));
    $("weekBanner").textContent = "📅 오늘은 2학기 "+curWeek()+"주차 · 지금까지 배운 데까지 문제를 내요 (예상)";
    const dd=getDaily(); $("dToday").textContent=dd.solved; $("dCorrect").textContent=dd.correct;
    document.querySelectorAll(".scount").forEach(el=>{ el.textContent = "지금 진도: "+unitName(el.dataset.c,grade); });
    $("noteCnt").textContent=getWrongs().length;
  }
  function setChild(c){ child=c; if(!CHILD_GRADE[child])child="태희"; LS.set("study_child",child); refreshHome(); }
  document.querySelectorAll("#childPick .pick").forEach(b=>b.addEventListener("click",()=>setChild(b.dataset.child)));
  document.querySelectorAll("#subjectPick .subj").forEach(b=>b.addEventListener("click",()=>startQuiz(b.dataset.subj)));
  $("whoChip").addEventListener("click",()=>setChild(child==="태희"?"태정":"태희"));

  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  function startQuiz(subj){
    subject=subj; retryMode=false;
    let lim=unlockedUnit(subj,grade);
    let pool=(BANK[subj][grade]||[]).filter(p=>p.u<=lim);
    while(pool.length<4 && lim<UNITS[subj][grade].length){ lim++; pool=(BANK[subj][grade]||[]).filter(p=>p.u<=lim); }
    if(!pool.length) pool=(BANK[subj][grade]||[]).slice();
    quizList = shuffle(pool).map(q=>Object.assign({},q,{subj,grade,retry:0}));
    qi=0; score=0; renderQ(); show("quiz");
  }
  function startRetryFromNote(){
    const w=getWrongs(); if(!w.length) return;
    retryMode=true;
    quizList = shuffle(w).map(x=> (x.gen && GEN[x.gen])
      ? Object.assign(GEN[x.gen](), {gen:x.gen,u:x.u,subj:x.subj,grade:x.grade,retry:0})
      : Object.assign({},x,{retry:0}) );
    qi=0; score=0; renderQ(); show("quiz");
  }
  function makeSimilar(item){
    if(item.gen && GEN[item.gen]){ return Object.assign(GEN[item.gen](), {gen:item.gen, u:item.u, subj:item.subj, grade:item.grade, retry:(item.retry||0)+1}); }
    const sibs=(BANK[item.subj][item.grade]||[]).filter(p=>p.u===item.u && p.q!==item.q);
    const base = sibs.length? sibs[rnd(sibs.length)] : item;
    return Object.assign({},base,{subj:item.subj,grade:item.grade,retry:(item.retry||0)+1});
  }
  function renderQ(){
    answered=false;
    const item=quizList[qi];
    const rt = item.retry>0;
    const tag=$("qTag"); tag.className="qtag"+(rt?" retry":"");
    tag.textContent = rt ? ("🔁 비슷한 문제 다시!") : ((SUBJ_KO[item.subj]||"")+" · "+(UNITS[item.subj][item.grade][item.u-1]||"")+(retryMode?" · 📒복습":""));
    $("qText").textContent=item.q;
    $("qCount").textContent=(qi+1)+"/"+quizList.length;
    $("progBar").style.width=(qi/quizList.length*100)+"%";
    const box=$("choices"); box.innerHTML="";
    const keys=["가","나","다","라"];
    item.c.forEach((ch,idx)=>{ const b=document.createElement("button"); b.className="choice"; b.innerHTML='<span class="key">'+keys[idx]+'</span><span>'+escapeHtml(ch)+'</span>'; b.addEventListener("click",()=>choose(idx,b)); box.appendChild(b); });
    $("feedback").classList.add("hidden"); $("nextBtn").classList.add("hidden");
  }
  function choose(idx,btn){
    if(answered) return; answered=true;
    const item=quizList[qi];
    const correct = idx===item.a;
    bumpDaily(correct);
    $("choices").querySelectorAll(".choice").forEach((b,i)=>{ b.disabled=true; if(i===item.a) b.classList.add("correct"); });
    if(correct){ score++; }
    else{
      btn.classList.add("wrong");
      const w=getWrongs();
      if(!w.some(x=>x.q===item.q)){ w.push({q:item.q,c:item.c,a:item.a,e:item.e,gen:item.gen,u:item.u,subj:item.subj,grade:item.grade}); saveWrongs(w); }
      // 비슷한 문제 한 번 더 (같은 원문당 1회)
      if((item.retry||0)<1 && quizList.length<24){ quizList.push(makeSimilar(item)); }
    }
    const fb=$("feedback"); fb.className="feedback "+(correct?"ok":"no");
    fb.innerHTML = correct
      ? '<div class="fh">🎉 정답이에요!</div><div class="exp">'+escapeHtml(item.e)+'</div>'
      : '<div class="fh">📒 오답노트에 담았어요 · 비슷한 문제 또 나와요</div><div class="exp"><b>정답: '+escapeHtml(item.c[item.a])+'</b><br>'+escapeHtml(item.e)+'</div>';
    fb.classList.remove("hidden");
    $("nextBtn").textContent=(qi===quizList.length-1)?"결과 보기 →":"다음 →";
    $("nextBtn").classList.remove("hidden");
    $("progBar").style.width=((qi+1)/quizList.length*100)+"%";
    $("qCount").textContent=(qi+1)+"/"+quizList.length;
  }
  $("nextBtn").addEventListener("click",()=>{ if(qi<quizList.length-1){ qi++; renderQ(); } else finish(); });
  $("quizBack").addEventListener("click",()=>{ refreshHome(); show("home"); });

  function finish(){
    const total=quizList.length;
    $("rScore").innerHTML=score+'<small>/'+total+'</small>';
    const pct=score/total; let emo,msg;
    if(pct===1){emo="🏆";msg="완벽해요! 다 맞았어요!";}
    else if(pct>=0.7){emo="🎉";msg="잘했어요!";}
    else if(pct>=0.4){emo="💪";msg="좋아요, 오답노트로 복습해요!";}
    else{emo="📒";msg="괜찮아요! 오답노트 보면 금방 늘어요";}
    $("rEmoji").textContent=emo; $("rMsg").textContent=msg;
    const wrong=total-score;
    $("rSub").textContent = wrong>0 ? ("틀린 문제는 오답노트에 담고 비슷한 문제로 다시 냈어요 📒") : "오답이 없어요! 최고!";
    const dd=getDaily(); $("rToday").innerHTML="오늘 "+child+"이(가) 푼 문제: <b>"+dd.solved+"개</b> · 정답 <b>"+dd.correct+"개</b> 🔥";
    $("rNoteCnt").textContent=getWrongs().length;
    show("result");
  }
  $("rHome").addEventListener("click",()=>{ refreshHome(); show("home"); });
  $("rRetry").addEventListener("click",()=>{ retryMode?startRetryFromNote():startQuiz(subject); });
  $("rNote").addEventListener("click",openNote);

  function openNote(){
    $("wbWho").textContent=child;
    const w=getWrongs(); const list=$("wbList");
    if(!w.length){ list.innerHTML='<div class="empty"><span class="big">✨</span>오답노트가 비어 있어요!<br>문제를 풀면 틀린 것만 여기 모여요.</div>'; $("wbActions").classList.add("hidden"); }
    else{ $("wbActions").classList.remove("hidden"); list.innerHTML=w.map(x=>('<div class="wbitem"><div class="wtag">'+(SUBJ_KO[x.subj]||"")+' · '+(UNITS[x.subj]&&UNITS[x.subj][x.grade]?UNITS[x.subj][x.grade][x.u-1]:x.grade+"학년")+'</div><div class="wq">'+escapeHtml(x.q)+'</div><div class="wa">정답: '+escapeHtml(x.c[x.a])+'</div><div class="we">'+escapeHtml(x.e)+'</div></div>')).join(""); }
    show("wrongbook");
  }
  $("openNote").addEventListener("click",openNote);
  $("wbBack").addEventListener("click",()=>{ refreshHome(); show("home"); });
  $("wbRetry").addEventListener("click",startRetryFromNote);
  $("wbClear").addEventListener("click",()=>{ if(confirm(child+"의 오답노트를 전부 지울까요?")){ saveWrongs([]); openNote(); } });

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  refreshHome(); show("home");
})();
</script>
