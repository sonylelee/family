<title>소니드 공부방 · 문제풀이 & 오답노트</title>
<style>
  :root{
    --bg:#eef4fb; --surface:#ffffff; --surface-2:#eaf1f9; --border:#dbe6f2;
    --text:#1e2b3a; --text-2:#5b6b7e; --text-3:#8a97a8;
    --brand:#2f7fd6; --brand-2:#1e63ad; --brand-soft:#e2eefb;
    --accent:#ff9a52; --accent-soft:#fff0e3;
    --good:#22a35a; --good-soft:#dff3e7;
    --bad:#e5533c; --bad-soft:#fce3de;
    --intl:#7a5cd6; --intl-soft:#ece5fb;
    --shadow:0 2px 4px rgba(30,50,80,.05),0 10px 26px rgba(30,50,80,.08);
    --radius:18px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#111823; --surface:#1a2431; --surface-2:#22303f; --border:#2e3d4f;
      --text:#eef4fb; --text-2:#a7b6c7; --text-3:#76889a;
      --brand:#5aa2e6; --brand-2:#7cb6ee; --brand-soft:#1c2c3e;
      --accent:#ffab6b; --accent-soft:#33241a;
      --good:#4cc27f; --good-soft:#16311f;
      --bad:#f27661; --bad-soft:#3a1e18;
      --intl:#a78bec; --intl-soft:#241a3a;
      --shadow:0 2px 4px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"]{
    --bg:#eef4fb; --surface:#ffffff; --surface-2:#eaf1f9; --border:#dbe6f2;
    --text:#1e2b3a; --text-2:#5b6b7e; --text-3:#8a97a8;
    --brand:#2f7fd6; --brand-2:#1e63ad; --brand-soft:#e2eefb;
    --accent:#ff9a52; --accent-soft:#fff0e3;
    --good:#22a35a; --good-soft:#dff3e7; --bad:#e5533c; --bad-soft:#fce3de;
    --intl:#7a5cd6; --intl-soft:#ece5fb;
    --shadow:0 2px 4px rgba(30,50,80,.05),0 10px 26px rgba(30,50,80,.08);
  }
  :root[data-theme="dark"]{
    --bg:#111823; --surface:#1a2431; --surface-2:#22303f; --border:#2e3d4f;
    --text:#eef4fb; --text-2:#a7b6c7; --text-3:#76889a;
    --brand:#5aa2e6; --brand-2:#7cb6ee; --brand-soft:#1c2c3e;
    --accent:#ffab6b; --accent-soft:#33241a;
    --good:#4cc27f; --good-soft:#16311f; --bad:#f27661; --bad-soft:#3a1e18;
    --intl:#a78bec; --intl-soft:#241a3a;
    --shadow:0 2px 4px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px; margin:0 auto; padding:20px 16px 60px; min-height:100vh}
  button{font-family:inherit; cursor:pointer}
  .hidden{display:none !important}

  .appbar{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,var(--brand),var(--brand-2));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:var(--shadow)}
  .appbar h1{font-size:1.25rem;margin:0;font-weight:800;letter-spacing:-.02em}
  .crumb{margin-left:auto;font-size:.8rem;color:var(--text-2);background:var(--surface);border:1px solid var(--border);padding:6px 12px;border-radius:20px;font-weight:700;max-width:60%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .weekbanner{background:var(--brand-soft);border:1px solid var(--brand);color:var(--brand);border-radius:12px;padding:11px 14px;font-weight:700;font-size:.86rem;margin-bottom:10px}
  .weekbanner.intl{background:var(--intl-soft);border-color:var(--intl);color:var(--intl)}
  .dailystat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:.9rem;color:var(--text-2);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .dailystat .em{font-size:1.3rem}
  .dailystat b{color:var(--brand);font-variant-numeric:tabular-nums;font-size:1.05rem}

  .section-t{font-size:.78rem;font-weight:800;letter-spacing:.03em;color:var(--text-3);text-transform:uppercase;margin:20px 4px 10px}
  .backbtn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-weight:700;color:var(--text-2);font-size:.86rem;margin-bottom:6px}

  .kids{display:flex;flex-direction:column;gap:10px}
  .kid{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);transition:.15s;text-align:left;width:100%}
  .kid:hover{border-color:var(--brand);transform:translateY(-2px)}
  .kid .kemo{font-size:2rem}
  .kid .kname{font-weight:800;font-size:1.15rem}
  .kid .kmeta{font-size:.78rem;color:var(--text-3);font-weight:600;margin-top:2px}
  .kid .karr{margin-left:auto;color:var(--text-3);font-size:1.3rem}

  .tracks{display:flex;flex-direction:column;gap:12px}
  .track{display:flex;align-items:center;gap:16px;border-radius:18px;padding:20px;box-shadow:var(--shadow);transition:.15s;text-align:left;width:100%;border:2px solid var(--border);background:var(--surface)}
  .track:hover{transform:translateY(-2px)}
  .track.kr:hover{border-color:var(--brand)} .track.intl:hover{border-color:var(--intl)}
  .track .temo{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex:0 0 auto}
  .track.kr .temo{background:var(--brand-soft)} .track.intl .temo{background:var(--intl-soft)}
  .track .tname{font-weight:800;font-size:1.1rem}
  .track .tdesc{font-size:.8rem;color:var(--text-2);margin-top:2px}
  .track .tarr{margin-left:auto;color:var(--text-3);font-size:1.3rem}

  .subjects{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .subj{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 8px;text-align:center;box-shadow:var(--shadow);transition:.15s}
  .subj:hover{transform:translateY(-3px);border-color:var(--brand)}
  .subj .semo{font-size:2rem;display:block;margin-bottom:6px}
  .subj .sname{font-weight:800;font-size:.98rem}
  .subj .scount{font-size:.7rem;color:var(--brand);margin-top:4px;display:block;font-weight:600;line-height:1.3}
  .subj.intl:hover{border-color:var(--intl)} .subj.intl .scount{color:var(--intl)}

  .bigbtn{display:block;width:100%;border:none;border-radius:14px;background:var(--brand);color:#fff;font-size:1.05rem;font-weight:800;padding:16px;box-shadow:var(--shadow);transition:.15s;margin-top:16px}
  .bigbtn:hover{background:var(--brand-2)}
  .bigbtn.ghost{background:var(--surface);color:var(--brand);border:2px solid var(--border)}
  .bigbtn.intl{background:var(--intl)} .bigbtn.intl:hover{filter:brightness(.92)}

  .noteopen{display:flex;align-items:center;gap:10px;width:100%;background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);border-radius:14px;padding:13px 16px;font-weight:800;font-size:.95rem;margin-top:12px}
  .noteopen .cnt{margin-left:auto;background:var(--accent);color:#fff;border-radius:20px;padding:1px 10px;font-size:.8rem}

  .qtop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .qtop .back{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:38px;height:38px;font-size:1.1rem;color:var(--text-2)}
  .progress{flex:1;height:10px;background:var(--surface-2);border-radius:20px;overflow:hidden}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));width:0;transition:width .3s;border-radius:20px}
  .qcount{font-size:.82rem;font-weight:700;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}

  .qcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 20px;box-shadow:var(--shadow)}
  .qtag{display:inline-block;font-size:.72rem;font-weight:800;color:var(--brand);background:var(--brand-soft);padding:3px 11px;border-radius:20px;margin-bottom:12px}
  .qtag.retry{color:var(--accent);background:var(--accent-soft)}
  .qtag.intl{color:var(--intl);background:var(--intl-soft)}
  .qtext{font-size:1.25rem;font-weight:700;line-height:1.45;margin-bottom:18px;text-wrap:balance;white-space:pre-wrap}
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:14px 16px;font-size:1.05rem;font-weight:600;color:var(--text);text-align:left;transition:.12s}
  .choice:hover:not(:disabled){border-color:var(--brand)}
  .choice .key{width:28px;height:28px;flex:0 0 auto;border-radius:8px;background:var(--surface-2);color:var(--text-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem}
  .choice.correct{border-color:var(--good);background:var(--good-soft)}
  .choice.correct .key{background:var(--good);color:#fff}
  .choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .choice.wrong .key{background:var(--bad);color:#fff}
  .choice:disabled{cursor:default}

  .feedback{margin-top:16px;border-radius:14px;padding:14px 16px;font-size:.92rem;line-height:1.5}
  .feedback.ok{background:var(--good-soft);border:1px solid var(--good)}
  .feedback.no{background:var(--bad-soft);border:1px solid var(--bad)}
  .feedback .fh{font-weight:800;margin-bottom:4px}
  .feedback.ok .fh{color:var(--good)} .feedback.no .fh{color:var(--bad)}
  .feedback .exp{color:var(--text-2)}
  .feedback .exp b{color:var(--text)}

  .result{text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:30px 22px;box-shadow:var(--shadow)}
  .result .big{font-size:3.2rem;margin-bottom:6px}
  .result .score{font-size:2.4rem;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
  .result .score small{font-size:1.1rem;color:var(--text-3);font-weight:600}
  .result .msg{font-size:1.05rem;font-weight:700;margin:8px 0 2px}
  .result .sub{color:var(--text-2);font-size:.9rem}
  .result .today{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:.9rem;color:var(--text-2)}
  .result .today b{color:var(--brand)}

  .wbitem{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--bad);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px}
  .wbitem .wtag{font-size:.7rem;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
  .wbitem .wq{font-weight:700;margin:4px 0 6px;white-space:pre-wrap}
  .wbitem .wa{font-size:.86rem;color:var(--good);font-weight:700}
  .wbitem .we{font-size:.82rem;color:var(--text-2);margin-top:4px}
  .empty{text-align:center;color:var(--text-3);padding:40px 20px;font-size:.95rem}
  .empty .big{font-size:2.5rem;display:block;margin-bottom:8px}

  .row2{display:flex;gap:10px;margin-top:14px}
  .row2 .bigbtn{margin-top:0}

  .practice{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--border);border-radius:20px;padding:8px 15px;font-weight:700;font-size:.82rem;color:var(--text-2);margin-bottom:4px}
  .practice.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .practice .pstate{font-weight:800}
  .pbadge{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:7px 10px;font-size:.78rem;font-weight:800;margin-bottom:12px;text-align:center}
  .wbdel{float:right;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text-3);width:28px;height:28px;font-weight:800;cursor:pointer;margin-left:8px}
  .wbdel:hover{border-color:var(--bad);color:var(--bad)}

  /* interview */
  .ivcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 20px;box-shadow:var(--shadow)}
  .ivq{font-size:1.35rem;font-weight:800;line-height:1.4;text-wrap:balance;margin-bottom:6px}
  .ivqko{font-size:.85rem;color:var(--text-3);margin-bottom:16px}
  .ivbtns{display:flex;gap:10px;flex-wrap:wrap}
  .ivbtn{flex:1;min-width:120px;border:2px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;padding:12px;font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:6px}
  .ivbtn.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .transcript{margin-top:14px;background:var(--surface-2);border:1px dashed var(--border);border-radius:12px;padding:14px;min-height:56px;font-size:1rem;color:var(--text)}
  .transcript .ph{color:var(--text-3)}
  .model{margin-top:14px;background:var(--intl-soft);border:1px solid var(--intl);border-radius:12px;padding:14px 16px}
  .model .mh{font-weight:800;color:var(--intl);font-size:.8rem;margin-bottom:6px}
  .model .mtxt{font-size:1rem;font-weight:600;line-height:1.5}
  .model .mtip{font-size:.82rem;color:var(--text-2);margin-top:8px}
  .ivnav{display:flex;gap:10px;margin-top:14px}
  .ivnav button{flex:1;border-radius:12px;padding:14px;font-weight:800;border:2px solid var(--border);background:var(--surface);color:var(--text)}
  .ivnav button.prim{background:var(--intl);color:#fff;border-color:transparent}
  .note-inline{font-size:.78rem;color:var(--text-3);margin-top:10px}
</style>

<div class="wrap">
  <div class="appbar">
    <div class="logo">🎒</div>
    <h1>소니드 공부방</h1>
    <div class="crumb" id="crumb">시작</div>
  </div>

  <!-- HOME (3 steps) -->
  <div id="home">
    <!-- step 1: child -->
    <div id="vChild">
      <div class="section-t">누가 공부할까요?</div>
      <div class="kids" id="kidPick"></div>
    </div>

    <!-- step 2: track -->
    <div id="vTrack" class="hidden">
      <button class="backbtn" id="trackBack">← 아이 다시 고르기</button>
      <div class="section-t">무엇을 공부할까요?</div>
      <div class="tracks">
        <button class="track kr" data-track="kr"><div class="temo">🇰🇷</div><div><div class="tname">한국 학교 공부</div><div class="tdesc" id="krDesc">지금 학교 진도 · 수학·국어·영어</div></div><div class="tarr">›</div></button>
        <button class="track intl" data-track="intl"><div class="temo">🌍</div><div><div class="tname">국제학교 준비</div><div class="tdesc" id="intlDesc">영어로 · 입학시험 대비</div></div><div class="tarr">›</div></button>
      </div>
    </div>

    <!-- step 3: subject -->
    <div id="vSubject" class="hidden">
      <button class="backbtn" id="subjBack">← 트랙 다시 고르기</button>
      <div class="weekbanner" id="weekBanner"></div>
      <div class="dailystat" id="dailyStat"><span class="em">🔥</span><span>오늘 <b id="dToday">0</b>문제 · 정답 <b id="dCorrect">0</b></span></div>
      <button class="practice" id="practiceToggle">🧪 연습 모드 <span class="pstate">꺼짐</span></button>
      <div class="section-t" id="subjTitle">과목을 골라요</div>
      <div class="subjects" id="subjectPick"></div>
      <button class="noteopen" id="openNote">📒 오답노트 <span class="cnt" id="noteCnt">0</span></button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden">
    <div class="qtop">
      <button class="back" id="quizBack" aria-label="뒤로">←</button>
      <div class="progress"><i id="progBar"></i></div>
      <span class="qcount" id="qCount">1/8</span>
    </div>
    <div class="qcard">
      <div class="pbadge hidden" id="practiceBadge">🧪 연습 모드 · 기록 안 함</div>
      <span class="qtag" id="qTag">수학</span>
      <div class="qtext" id="qText">문제</div>
      <div class="choices" id="choices"></div>
      <div class="feedback hidden" id="feedback"></div>
    </div>
    <button class="bigbtn hidden" id="nextBtn">다음 →</button>
  </div>

  <!-- RESULT -->
  <div id="result" class="hidden">
    <div class="result">
      <div class="big" id="rEmoji">🎉</div>
      <div class="score" id="rScore">0<small>/8</small></div>
      <div class="msg" id="rMsg">잘했어요!</div>
      <div class="sub" id="rSub"></div>
      <div class="today" id="rToday"></div>
    </div>
    <div class="row2">
      <button class="bigbtn ghost" id="rHome">🏠 홈으로</button>
      <button class="bigbtn" id="rRetry">↺ 다시 풀기</button>
    </div>
    <button class="noteopen" id="rNote">📒 오답노트 보기 <span class="cnt" id="rNoteCnt">0</span></button>
  </div>

  <!-- WRONGBOOK -->
  <div id="wrongbook" class="hidden">
    <div class="qtop">
      <button class="back" id="wbBack" aria-label="뒤로">←</button>
      <div class="qcount" style="flex:1">📒 <span id="wbWho">태희</span>의 오답노트</div>
    </div>
    <div id="wbList"></div>
    <div class="row2" id="wbActions">
      <button class="bigbtn ghost" id="wbClear">전체 지우기</button>
      <button class="bigbtn" id="wbRetry">↺ 오답만 다시 풀기</button>
    </div>
  </div>

  <!-- INTERVIEW -->
  <div id="interview" class="hidden">
    <div class="qtop">
      <button class="back" id="ivBack" aria-label="뒤로">←</button>
      <div class="qcount" style="flex:1">🗣️ 영어 면담 연습</div>
      <span class="qcount" id="ivCount">1/8</span>
    </div>
    <div class="ivcard">
      <div class="ivq" id="ivQ">Question</div>
      <div class="ivqko" id="ivQko"></div>
      <div class="ivbtns">
        <button class="ivbtn" id="ivSpeak">🔊 들려주기</button>
        <button class="ivbtn" id="ivMic">🎤 말하기</button>
        <button class="ivbtn" id="ivReveal">💡 모범답안</button>
      </div>
      <div class="transcript" id="ivTrans"><span class="ph">🎤 "말하기"를 누르고 영어로 대답해보세요. 여기에 받아써져요.</span></div>
      <div class="model hidden" id="ivModel"></div>
      <div class="note-inline" id="ivNote"></div>
    </div>
    <div class="ivnav">
      <button id="ivPrev">← 이전</button>
      <button class="prim" id="ivNext">다음 질문 →</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const CHILDREN = [
    {name:"태운", emo:"👦", g:8,  kGrade:"중2 (2학기)",  intlG:"G8", intlNote:"TAS 대비"},
    {name:"태희", emo:"👧", g:5,  kGrade:"초5 (2학기)", intlG:"G7", intlNote:"2027.8 입학시험"},
    {name:"태정", emo:"🧒", g:4,  kGrade:"초4 (2학기)", intlG:"G6", intlNote:"2027.8 입학시험"}
  ];
  const findChild = n => CHILDREN.find(c=>c.name===n) || CHILDREN[1];

  const TRACKS = {
    kr:   { label:"한국 학교 공부", subjects:[{k:"math",emo:"🔢",n:"수학"},{k:"korean",emo:"📖",n:"국어"},{k:"english",emo:"🔤",n:"영어"}] },
    intl: { label:"국제학교 준비", subjects:[{k:"enmath",emo:"🧮",n:"영어 수학"},{k:"enread",emo:"📚",n:"영어 읽기"},{k:"interview",emo:"🗣️",n:"영어 면담"}] }
  };

  const UNITS = {
    math:   { 4:["분수의 덧셈과 뺄셈","삼각형","소수","사각형","꺾은선그래프","다각형"],
              5:["수의 범위와 어림","분수의 곱셈","합동과 대칭","소수의 곱셈","직육면체","평균과 가능성"],

        {u:1, q:"'generous' means…", c:["관대한, 잘 베푸는","이기적인","화난","조용한"], a:0, e:"generous = 너그러운"},
        {u:1, q:"Pick the correctly spelled word:", c:["beautiful","beatiful","beutiful","beautifull"], a:0, e:"beautiful"}
      ]
    }
  };
  const SUBJ_KO = {math:"수학", korean:"국어", english:"영어", enmath:"영어 수학", enread:"영어 읽기"};

  const INTERVIEW = [
    {q:"Can you introduce yourself?", ko:"자기소개를 해줄래요?", model:"Hi, my name is ___. I am ___ years old. I like ___. Nice to meet you.", tip:"이름·나이·좋아하는 것을 또박또박. 웃으며 인사!"},
    {q:"What is your favorite subject? Why?", ko:"가장 좋아하는 과목과 이유는?", model:"My favorite subject is ___ because it is fun and I am good at it.", tip:"과목 + 이유 한 문장"},

    {q:"Tell me about your family.", ko:"가족을 소개해줄래요?", model:"There are ___ people in my family. I have ___. We like to ___ together.", tip:"가족 수 + 구성원 + 함께 하는 것"},
    {q:"Why do you want to come to this school?", ko:"왜 이 학교에 오고 싶나요?", model:"I want to come to this school because I want to learn ___ and make new friends.", tip:"배우고 싶은 것 + 친구"},
    {q:"What is your favorite book or movie?", ko:"좋아하는 책이나 영화는?", model:"My favorite ___ is ___. I like it because ___.", tip:"제목 + 좋아하는 이유"},

    {q:"Do you have any questions for us?", ko:"우리에게 질문이 있나요?", model:"Yes. Can you tell me more about the clubs at this school?", tip:"질문 하나 준비하면 적극적으로 보여요!"}
  ];

  // ---------- generators ----------
  function rnd(n){ return Math.floor(Math.random()*n); }
  function gcd(a,b){ return b?gcd(b,a%b):a; }
  function fstr(n,d){ if(d===0) return ""+n; const g=gcd(Math.abs(n),Math.abs(d))||1; n/=g; d/=g; return d===1?(""+n):(n+"/"+d); }
  function pick4(correct, distractors){
    const set=[String(correct)];
    for(const x of distractors){ if(set.length>=4) break; if(x!=null && !set.includes(String(x))) set.push(String(x)); }
    let k=2; while(set.length<4){ const c=String(k); if(!set.includes(c)) set.push(c); k++; }
    for(let i=set.length-1;i>0;i--){ const j=rnd(i+1); [set[i],set[j]]=[set[j],set[i]]; }
    return { c:set, a:set.indexOf(String(correct)) };
  }
  const GEN = {
    fracAddSame(){ const ds=[4,5,6,8]; const d=ds[rnd(4)]; let a=1+rnd(d-2); let b=1+rnd(Math.max(1,d-1-a)); if(a+b>d){b=d-a;} if(b<1)b=1; const s=a+b; const cor=fstr(s,d);
      return Object.assign({q:a+"/"+d+" + "+b+"/"+d+" = ?", e:"분모가 같으면 분자끼리 더해요: "+a+"+"+b+"="+s+" → "+cor}, pick4(cor,[fstr(s,2*d),fstr(a*b,d),fstr(s+1,d)])); },
    fracSubSame(){ const ds=[4,5,6,8]; const d=ds[rnd(4)]; let a=2+rnd(d-1); if(a>d)a=d; let b=1+rnd(a-1); const diff=a-b; const cor=fstr(diff,d);
      return Object.assign({q:a+"/"+d+" - "+b+"/"+d+" = ?", e:"분모가 같으면 분자끼리 빼요: "+a+"-"+b+"="+diff+" → "+cor}, pick4(cor,[fstr(a+b,d),fstr(diff,2*d),fstr(diff+1,d)])); },
    decAdd(){ const xi=1+rnd(8), yi=1+rnd(8); const t=xi+yi; const dstr=v=>{const w=Math.floor(v/10),f=v%10; return f?(w+"."+f):(""+w);}; const cor=dstr(t);
      return Object.assign({q:"0."+xi+" + 0."+yi+" = ?", e:"소수점을 맞춰 더하면 "+cor}, pick4(cor,[dstr(t+1), dstr(t>1?t-1:t+2), xi+"."+yi])); },
    decMul(){ const ai=1+rnd(8), bi=1+rnd(8); const h=ai*bi; const cor=(+(h/100).toFixed(2)).toString();
      return Object.assign({q:"0."+ai+" × 0."+bi+" = ?", e:ai+"×"+bi+"="+h+", 소수 두 자리 → "+cor}, pick4(cor,[(+(h/10).toFixed(1)).toString(), ""+h, (+((h+1)/100).toFixed(2)).toString()])); },
    fracTimesInt(){ const bs=[2,3,4,5]; const b=bs[rnd(4)]; const a=1+rnd(b-1); const m=1+rnd(3); const k=b*m; const res=a*m;
      return Object.assign({q:a+"/"+b+" × "+k+" = ?", e:a+"/"+b+" × "+k+" = "+(a*k)+"/"+b+" = "+res}, pick4(""+res,[""+(a*k), fstr(a*k,b*2), ""+(res+1)])); },
    fracMul(){ const s=[2,3,4,5]; const b=s[rnd(4)], d=s[rnd(4)]; const a=1+rnd(b-1), c=1+rnd(d-1); const cor=fstr(a*c,b*d);
      return Object.assign({q:a+"/"+b+" × "+c+"/"+d+" = ?", e:"분자끼리, 분모끼리: ("+a+"×"+c+")/("+b+"×"+d+") = "+cor}, pick4(cor,[fstr(a+c,b+d),fstr(a*c,b+d),fstr(a*c+1,b*d)])); },
    roundInt(){ const n=11+rnd(88); const x=n/10; const cor=Math.round(x); const fd=n%10;
      return Object.assign({q:x.toFixed(1)+"을 반올림하여 자연수로 나타내면?", e:"소수 첫째 자리 "+fd+"은 "+(fd>=5?"5 이상이라 올림":"5 미만이라 버림")+" → "+cor}, pick4(""+cor,[""+Math.floor(x),""+Math.ceil(x),""+(cor+1)])); }
  };

  // ---------- storage ----------
  const LS = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

  function getPool(subj,g){ const b=BANK[subj]; if(!b) return []; return b[g]||b[5]||b[4]||[]; }
  function getUnitName(subj,g,u){ const U=UNITS[subj]; const arr=(U&&(U[g]||U[5]||U[4]))||[]; return arr[u-1]||arr[0]||""; }

  // 진도(초등 한국 공부만)
  const SEM_START = new Date(2026,7,18); const TOTAL_WEEKS=18;

  function unlockedUnit(subj){ const units=(UNITS[subj][child.g]||[]).length||1; const per=TOTAL_WEEKS/units; return Math.min(Math.max(Math.ceil(curWeek()/per),1),units); }

  $("subjBack").addEventListener("click",gotoTrack);

  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  function startQuiz(subj){
    subject=subj; retryMode=false; grade=child.g;
    let pool;
    if(isGated()){
      let lim=unlockedUnit(subj); pool=getPool(subj,grade).filter(p=>p.u<=lim);
      const total=(UNITS[subj][grade]||[]).length;
      while(pool.length<4 && lim<total){ lim++; pool=getPool(subj,grade).filter(p=>p.u<=lim); }
      if(!pool.length) pool=getPool(subj,grade).slice();
    } else { pool=getPool(subj,grade).slice(); }
    if(!pool.length){ alert("이 과목은 아직 문제 준비 중이에요."); return; }
    quizList = shuffle(pool).map(q=>Object.assign({},q,{subj,grade,retry:0}));
    qi=0; score=0; renderQ(); show("quiz");
  }
  function startRetryFromNote(){
    const w=getWrongs(); if(!w.length) return; retryMode=true;
    quizList = shuffle(w).map(x=> (x.gen && GEN[x.gen]) ? Object.assign(GEN[x.gen](),{gen:x.gen,u:x.u,subj:x.subj,grade:x.grade,retry:0}) : Object.assign({},x,{retry:0}) );
    qi=0; score=0; renderQ(); show("quiz");
  }
  function makeSimilar(item){
    if(item.gen && GEN[item.gen]) return Object.assign(GEN[item.gen](),{gen:item.gen,u:item.u,subj:item.subj,grade:item.grade,retry:(item.retry||0)+1});
    const sibs=getPool(item.subj,item.grade).filter(p=>p.u===item.u && p.q!==item.q);
    const base=sibs.length?sibs[rnd(sibs.length)]:item;
    return Object.assign({},base,{subj:item.subj,grade:item.grade,retry:(item.retry||0)+1});
  }
  function renderQ(){
    answered=false; const item=quizList[qi]; const rt=item.retry>0; const intl=(item.subj==="enmath"||item.subj==="enread");
    const tag=$("qTag"); tag.className="qtag"+(rt?" retry":(intl?" intl":""));
    tag.textContent = rt ? "🔁 비슷한 문제 다시!" : ((SUBJ_KO[item.subj]||"")+" · "+(intl?("국제학교 "+child.intlG):getUnitName(item.subj,item.grade,item.u)));
    $("qText").textContent=item.q; $("qCount").textContent=(qi+1)+"/"+quizList.length; $("progBar").style.width=(qi/quizList.length*100)+"%";
    const box=$("choices"); box.innerHTML=""; const keys=["가","나","다","라"];
    item.c.forEach((ch,idx)=>{ const b=document.createElement("button"); b.className="choice"; b.innerHTML='<span class="key">'+keys[idx]+'</span><span>'+escapeHtml(ch)+'</span>'; b.addEventListener("click",()=>choose(idx,b)); box.appendChild(b); });

  function choose(idx,btn){
    if(answered) return; answered=true; const item=quizList[qi]; const correct=idx===item.a;

    else{
      btn.classList.add("wrong");

      if((item.retry||0)<1 && quizList.length<24){ quizList.push(makeSimilar(item)); }
    }
    const fb=$("feedback"); fb.className="feedback "+(correct?"ok":"no");
    if(correct){ fb.innerHTML='<div class="fh">🎉 정답이에요!</div><div class="exp">'+escapeHtml(item.e)+'</div>'; }
    else{ const head=practiceMode?'🧪 연습 모드 · 기록 안 함':'📒 오답노트에 담았어요 · 비슷한 문제 또 나와요'; fb.innerHTML='<div class="fh">'+head+'</div><div class="exp"><b>정답: '+escapeHtml(item.c[item.a])+'</b><br>'+escapeHtml(item.e)+'</div>'; }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function stopRec(){ ivRecActive=false; $("ivMic").classList.remove("on"); $("ivMic").textContent="🎤 말하기"; try{ if(ivRecog) ivRecog.stop(); }catch(e){} }

      let finalTxt="";
      ivRecog.onresult=e=>{ let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) finalTxt+=t+" "; else interim+=t; } $("ivTrans").textContent=(finalTxt+interim)||"…"; };
      ivRecog.onerror=ev=>{ $("ivNote").textContent="마이크 권한을 허용해주세요 (에러: "+ev.error+")"; stopRec(); };
      ivRecog.onend=()=>{ if(ivRecActive){ try{ivRecog.start();}catch(e){} } };
      ivRecog.start(); ivRecActive=true; $("ivMic").classList.add("on"); $("ivMic").textContent="⏹ 멈추기"; $("ivNote").textContent="";
    }catch(e){ $("ivNote").textContent="말하기 인식을 시작할 수 없어요."; }
  });

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  // init
  renderKids(); gotoChild();
})();
</script>
